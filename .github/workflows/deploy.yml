# Tujuan: Memvalidasi, membangun, memublikasikan image AccAPI, lalu memicu redeploy Coolify dari main.
# Caller: Push ke main atau workflow_dispatch operator.
# Dependensi: Git public fetch, npm, Docker Buildx, GHCR, serta secret URL/token Coolify.
# Main Functions: lint/typecheck/UJI (TypeScript + self-check Python), build image bertag commit SHA + latest, push GHCR, trigger Coolify dengan timeout terbatas.
# Side Effects: Menulis package GHCR dan memicu deployment production; job se-branch diserialisasi agar publish/deploy tidak saling mendahului.
name: Deploy to Coolify

on:
  push:
    branches:
      - main
  # Uji ikut berjalan pada pull request; hanya `build-and-push` yang dibatasi ke push ke main,
  # supaya yang menahan merge dan yang menahan deploy adalah gerbang yang SAMA.
  pull_request: {}
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/accapi-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/accapi-backend

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch trusted revision without credentials
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$TRUSTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # 72 uji TypeScript dan 21 self-check Python sudah ada di repo ini sejak lama, dan sampai
      # 16 September 2026 TIDAK SATU PUN dijalankan alur mana pun. Empat self-check sudah rusak
      # di `main` tanpa ada yang tahu — termasuk satu-satunya uji yang menghasilkan Form PDF dan
      # Dataset Excel dari surat sungguhan. Selama itu jalur Summary diperbaiki sebelas kali
      # lewat mata manusia di layar produksi.
      - run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      # `pytest` BUKAN hiasan: sepuluh berkas uji di sini hanya berisi `def test_*()` tanpa
      # `__main__`, dan tanpa pytest mereka lulus tanpa menjalankan satu assert pun (59 uji).
      # Ia tidak masuk `requirements.txt` karena image produksi tidak perlu menjalankan uji.
      - run: pip install -r python_backend/requirements.txt pyflakes pytest
      # Gerbang NAMA TAK TERDEFINISI. `datetime` yang tak pernah di-import di `main.py` (#3)
      # hanya berbunyi saat jalurnya dilewati di produksi, dan pesannya menyamarkan. Satu baris
      # ini menutup seluruh kelasnya. Peringatan gaya (impor tak terpakai) TIDAK menahan:
      # `shared.py` memang gerbang re-export, dan gerbang yang berisik akan dimatikan orang.
      - name: pyflakes - nama tak terdefinisi
        run: |
          python -m pyflakes python_backend/*.py python_backend/routers/*.py > flakes.txt || true
          if grep -E "undefined name|referenced before assignment" flakes.txt; then
            echo "::error::pyflakes menemukan nama yang tidak terdefinisi"
            exit 1
          fi
          echo "pyflakes: tidak ada nama tak terdefinisi"
      # `test_e2e_live` melewat sendiri di sini (tanpa kunci Mistral dan tanpa cache), jadi
      # gerbang ini tidak pernah membelanjakan uang API.
      - run: npm run test:python

  build-and-push:
    needs: typecheck
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$TRUSTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_FASTAPI_BASE_URL=${{ secrets.NEXT_PUBLIC_FASTAPI_BASE_URL }}
            NEXT_PUBLIC_ACCURATE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ACCURATE_CLIENT_ID }}
            NEXT_PUBLIC_ACCURATE_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_ACCURATE_REDIRECT_URI }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --silent --fail --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --url "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json"
